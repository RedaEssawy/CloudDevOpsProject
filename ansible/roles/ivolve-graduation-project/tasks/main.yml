---
# tasks file for ivolve-graduation-project
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    
- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Install Git
  apt:
    name: git
    state: present

- name: Install Ansible
  apt:
    name: ansible
    state: present

- name: Install Python3
  apt:
    name: python3
    state: present

- name: Install Python3-pip
  apt:
    name: python3-pip
    state: present

- name: Install java
  apt:
    name: default-jdk
    state: present

- name: Install boto3
  apt:
    name: python3-boto3
    state: present

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins repository key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    update_cache: yes

- name: Install Java runtime (required for Jenkins)
  apt:
    name: fontconfig
    state: present

- name: Install Java (OpenJDK 21 JRE)
  apt:
    name: openjdk-21-jre
    state: present

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Start Jenkins service
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to start up
  wait_for:
    port: 8080
    delay: 10
    timeout: 300

- name: Get the initial admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: initial_admin_password_encoded

- name: Display Jenkins initial admin password
  debug:
    msg: "Jenkins initial admin password: {{ initial_admin_password_encoded['content'] | b64decode }}"
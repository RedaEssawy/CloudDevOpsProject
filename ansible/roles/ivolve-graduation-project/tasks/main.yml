---
# tasks file for ivolve-graduation-project
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    
- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Install Git
  apt:
    name: git
    state: present

- name: Install Ansible
  apt:
    name: ansible
    state: present

- name: Install Python3
  apt:
    name: python3
    state: present

- name: Install Python3-pip
  apt:
    name: python3-pip
    state: present

- name: Install java
  apt:
    name: default-jdk
    state: present

- name: Install boto3
  apt:
    name: python3-boto3
    state: present